---
- name: macOS Setup Playbook
  hosts: localhost
  connection: local
  gather_facts: true
  
  tasks:
    - name: Install Homebrew
      shell: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      args:
        creates: /opt/homebrew/bin/brew
      tags: ci_test
      
    - name: Install CLI tools
      community.general.homebrew:
        name:
          - copilot-cli
          - dockutil
          - mas
          - node
          - gh
          - yamllint
        state: present
      tags: ci_test
      
    - name: Install Claude CLI
      shell: curl -fsSL https://claude.ai/install.sh | bash
      args:
        creates: ~/.local/bin/claude
      tags: ci_test
        
    - name: Install Mac App Store applications
      shell: |
        export PATH="/opt/homebrew/bin:$PATH"
        mas install {{ item }}
      become: yes
      loop: [462054704, 462058435, 462062816, 1291898086, 803453959]  # Word, Excel, PowerPoint, Toggl Track, Slack
      
    - name: Install applications via Homebrew
      community.general.homebrew_cask:
        name:
          - 1password
          - kiro-cli
          - claude
        state: present
      ignore_errors: yes
      tags: ci_test
        
    - name: "Download and Install DMG applications"
      shell: |
        if [ -d "/Applications/{{ item.app_name }}" ]; then
          echo "{{ item.app_name }} already installed, skipping"
          exit 0
        fi
        cd /tmp
        curl -L -o "{{ item.name }}.dmg" "{{ item.url }}"
        hdiutil attach "{{ item.name }}.dmg" -quiet -nobrowse
        VOLUME=$(ls /Volumes/ | grep -i "{{ item.name | regex_replace(' ', '.*') }}" | head -1)
        cp -R "/Volumes/$VOLUME/{{ item.app_name }}" /Applications/
        hdiutil detach "/Volumes/$VOLUME" -quiet
      loop:
        - {name: "Vivaldi", url: "https://downloads.vivaldi.com/stable/Vivaldi.dmg", app_name: "Vivaldi.app"}
        - {name: "Google Chrome", url: "https://dl.google.com/chrome/mac/stable/GGRO/googlechrome.dmg", app_name: "Google Chrome.app"}
        - {name: "Discord", url: "https://discord.com/api/download?platform=osx", app_name: "Discord.app"}
        - {name: "ChatGPT", url: "https://persistent.oaistatic.com/sidekick/public/ChatGPT_Desktop_public_latest.dmg", app_name: "ChatGPT.app"}
        - {name: "Notion", url: "https://www.notion.so/desktop/mac-universal/download", app_name: "Notion.app"}
        - {name: "Notion Calendar", url: "https://www.notion.so/calendar/desktop/mac/download", app_name: "Notion Calendar.app"}
        - {name: "Firefox", url: "https://download.mozilla.org/?product=firefox-latest&os=osx&lang=en-US", app_name: "Firefox.app"}
        - {name: "Docker", url: "https://desktop.docker.com/mac/main/arm64/Docker.dmg", app_name: "Docker.app"}
        - {name: "DeepL", url: "https://www.deepl.com/en/macos/download/DeepL.dmg", app_name: "DeepL.app"}
      tags: ci_test
        
    - name: "Download and Install ZIP applications"
      shell: |
        if [ -d "/Applications/{{ item.app_name }}" ]; then
          echo "{{ item.app_name }} already installed, skipping"
          exit 0
        fi
        cd /tmp
        curl -L -o "{{ item.name }}.zip" "{{ item.url }}"
        unzip -o "{{ item.name }}.zip"
        cp -R "{{ item.app_name }}" /Applications/
        {% if item.open is defined %}open "/Applications/{{ item.app_name }}"{% endif %}
      loop:
        - {name: "VSCode", url: "https://update.code.visualstudio.com/latest/darwin-universal/stable", app_name: "Visual Studio Code.app"}
        - {name: "Setapp", url: "https://go.setapp.com/download/client", app_name: "Install Setapp.app", open: true}
      tags: ci_test
        
    - name: Clear existing dock items
      shell: dockutil --remove all --no-restart
      ignore_errors: yes
      
    - name: Add applications to dock
      shell: "dockutil --add \"{{ item.path }}\" {{ item.options | default('') }} --no-restart"
      ignore_errors: yes
      loop:
        - {path: "/Applications/Vivaldi.app", options: "--position 2"}
        - {path: "/Applications/1Password.app", options: "--position 3"}
        - {path: "/Applications/Visual Studio Code.app", options: "--position 4"}
        - {path: "/Applications/Claude.app", options: "--position 5"}
        - {path: "/Applications/Notion.app", options: "--position 6"}
        - {path: "/Applications/Notion Calendar.app", options: "--position 7"}
        - {path: "/System/Applications/Mail.app", options: "--position 8"}
        - {path: "/Applications/Toggl Track.app", options: "--position 9"}
        - {path: "/Applications/Slack.app", options: "--position 10"}
        - {path: "/Applications/Firefox.app", options: "--position 11"}
        - {path: "/Applications", options: "--view grid --display folder --sort name --position 12"}
        - {path: "/System/Applications/Apps.app", options: "--position 13"}
        - {path: "/System/Applications/System Settings.app", options: "--position 14"}
        
    - name: Check if BetterTouchTool is installed
      stat:
        path: /Applications/Setapp/BetterTouchTool.app
      register: btt_app
      tags: btt

    - name: Activate BetterTouchTool
      shell: open -a "BetterTouchTool"
      changed_when: false
      when: btt_app.stat.exists
      tags: btt

    - name: Wait for BetterTouchTool to be fully launched
      shell: pgrep -x "BetterTouchTool"
      register: btt_process_check
      until: btt_process_check.rc == 0
      retries: 30
      delay: 1
      changed_when: false
      when: btt_app.stat.exists
      tags: btt

    - name: Allow BetterTouchTool additional time to initialize
      pause:
        seconds: 2
      when: btt_app.stat.exists
      tags: btt

    - name: Import BetterTouchTool preset
      shell: open "btt://import?path={{ playbook_dir | urlencode }}/configs/bettertouchtool/keyboardshortcuts.bttpreset"
      when: btt_app.stat.exists
      tags: btt

    - name: Ensure LaunchAgents directory exists
      ansible.builtin.file:
        path: ~/Library/LaunchAgents
        state: directory
        mode: '0755'
      tags: keyboard

    - name: Install CapsLock->Ctrl key remapping LaunchAgent
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/configs/keyboard/com.local.KeyRemapping.plist"
        dest: ~/Library/LaunchAgents/com.local.KeyRemapping.plist
        mode: '0644'
      tags: keyboard

    - name: Apply CapsLock->Ctrl key remapping immediately
      shell: >
        hidutil property --set
        '{"UserKeyMapping":[{"HIDKeyboardModifierMappingSrc":0x700000039,"HIDKeyboardModifierMappingDst":0x7000000E0}]}'
      changed_when: false
      tags: keyboard

    - name: Restart dock
      shell: killall Dock
