name: Auto Release

on:
  push:
    branches: [ main ]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate tag
        id: tag
        run: |
          TAG="$(date -u +'%Y%m%d%H%MZ')-${GITHUB_SHA::7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create release
        run: |
          # Note: This step uses GitHub CLI (gh) which is pre-installed on ubuntu-latest runners
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release with tag '$TAG' already exists. Skipping release creation."
          else
            if ! gh release create "$TAG" \
              --title "Release $TAG" \
              --generate-notes; then
              echo "Error: Failed to create release with tag '$TAG'." >&2
              exit 1
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
