name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      
      - name: Display macOS version
        run: sw_vers
      
      - name: Install Ansible
        run: brew install ansible
      
      - name: Install Ansible community.general collection
        run: ansible-galaxy collection install community.general --upgrade
      
      - name: Syntax check
        run: ansible-playbook setup.yml --syntax-check
      
      - name: Run CI tests
        run: ansible-playbook setup.yml --tags ci_test -vv